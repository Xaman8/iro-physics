name: Deploy the bench to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a site _site
          mkdir -p _site/paper
          if compgen -G "paper/*.pdf" > /dev/null; then
            cp -a paper/*.pdf _site/paper/
          fi
          touch _site/.nojekyll
          python3 tools/stamp_assets.py _site "${GITHUB_SHA}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
