<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apparatus · IRO Physics</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="app">
  <header class="top" data-page="bench.html"></header>
  <div class="bench-bar" id="benchBar"></div>
  <main class="bench-column" id="v1views">
    <section class="pane envelope-stage" id="envelope" aria-label="Envelope physics view"></section>
    <details class="francis-fold" id="francis">
      <summary>Francis system physics</summary>
      <section class="francis-body" id="physics" aria-label="Classic physics view"></section>
    </details>
  </main>
  <main class="v2-layout" id="v2views" hidden>
    <section class="pane v2-graph" id="v2graph" aria-label="v2 envelope graph"></section>
    <aside class="v2-detail" id="v2detail"></aside>
  </main>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/bench.js"></script>
</body>
</html>
