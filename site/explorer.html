<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envelope explorer · IRO Physics</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="top" data-page="explorer.html"></header>
  <main class="wrap explorer">
    <p class="kicker">Toy model v3</p>
    <h1>Envelope explorer</h1>
    <p class="opening">This is a made-up toy plant, not real plant data. Open a node to see what sits inside it; the charts are the X3 run, seed 3000, and they are for display only.</p>
    <div class="ex-bar">
      <div class="seg" role="group" aria-label="Hierarchy">
        <button type="button" class="btn" id="treeDesigned" aria-pressed="true">Designed</button>
        <button type="button" class="btn" id="treeDiscovered" aria-pressed="false">Discovered</button>
      </div>
      <ul class="dom-legend" id="legend"></ul>
    </div>
    <p class="ex-note" id="portNote"></p>
    <div class="tree" id="tree"></div>
    <p class="ex-note" id="chartNote"></p>
    <div class="chart-row" id="charts"></div>
  </main>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/explorer.js"></script>
</body>
</html>
